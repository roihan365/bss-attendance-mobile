name: bss_attendance_new
description: "BSS Attendance Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  geocoding: ^4.0.0
  provider: ^6.1.5+1
  connectivity_plus: ^7.1.1
  http: ^1.6.0
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  get_it: ^8.0.3
  sqflite: ^2.4.1
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  url_launcher: ^6.3.3
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4+4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/bss_launcher_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/bss_launcher_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
